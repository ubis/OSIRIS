// AirPlay on the NET input: shairport-sync writes 16-bit stereo at 44.1 kHz
// into pcmd's pipe at full level, and the track, the play state and the
// volume slider into osirisd's, which sets the receiver's volume; the
// receiver shows up under its host name.
general = {
	name = "%H";
	output_backend = "pipe";
	ignore_volume_control = "yes";
};

pipe = {
	name = "/var/run/pcm";
};

metadata = {
	enabled = "yes";
	include_cover_art = "no";
	pipe_name = "/var/run/airplay-meta";
};
