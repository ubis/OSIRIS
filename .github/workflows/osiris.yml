# SPDX-License-Identifier: BSD-2-Clause

name: osiris

on:
  push:
    branches:
      - '**'
    tags:
      - 'osiris-v*'
    paths:
      - 'buildroot'
      - 'buildroot-patches/**'
      - 'docker/**'
      - 'dspboot/docker/**'
      - 'dspboot/tools/**'
      - 'external/**'
      - 'services/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/osiris.yml'
  pull_request:
    paths:
      - 'buildroot'
      - 'buildroot-patches/**'
      - 'docker/**'
      - 'dspboot/docker/**'
      - 'dspboot/tools/**'
      - 'external/**'
      - 'services/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/osiris.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osiris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the build image if missing
        run: |
          tag=$(sha256sum docker/Dockerfile | cut -c1-12)
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/osiris-buildroot:$tag
          if docker manifest inspect "$img" > /dev/null 2>&1; then
            echo "$img already published"
            exit 0
          fi
          docker build -t "$img" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            docker
          docker push "$img"

  toolchain:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    outputs:
      dir: ${{ steps.key.outputs.dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Toolchain key
        id: key
        run: |
          name=$(sed -n 's|^BR2_TOOLCHAIN_EXTERNAL_PATH=".*/build/toolchains/\(.*\)"$|\1|p' \
            external/configs/onkyo_nr_defconfig)
          key=$({ git -C buildroot rev-parse HEAD; grep -E '^(# )?BR2_' \
            "external/configs/toolchain_${name}_defconfig"; } | sha256sum | cut -c1-12)
          echo "dir=$name-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: cache
        with:
          path: build/toolchains/${{ steps.key.outputs.dir }}
          key: toolchain-${{ steps.key.outputs.dir }}

      - name: Pull the build image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tag=$(sha256sum docker/Dockerfile | cut -c1-12)
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/osiris-buildroot:$tag
          if docker pull -q "$img"; then
            docker tag "$img" "osiris-buildroot:$tag"
          else
            echo "::notice::$img not published, make builds it"
          fi

      - name: Build the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: make toolchain

  build:
    needs: toolchain
    if: ${{ !cancelled() && needs.toolchain.result == 'success' }}
    runs-on: ubuntu-26.04
    outputs:
      tar: ${{ steps.bundle.outputs.tar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Check out Buildroot
        id: buildroot
        run: |
          git submodule update --init --depth 1 buildroot
          echo "rev=$(git -C buildroot rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: build/toolchains/${{ needs.toolchain.outputs.dir }}
          key: toolchain-${{ needs.toolchain.outputs.dir }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v6
        id: dl
        with:
          path: dl
          key: dl-${{ steps.buildroot.outputs.rev }}-${{ hashFiles('external/configs/*', 'external/package/**') }}
          restore-keys: dl-

      - uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-

      - name: Patch Buildroot
        run: make buildroot-src

      - name: Output key
        id: key
        run: |
          inputs=$({ git rev-parse HEAD:Makefile HEAD:buildroot-patches HEAD:docker/Dockerfile HEAD:external
                     git ls-files services; git ls-files -s ':(glob)services/*/Makefile'; } | sha256sum | cut -c1-16)
          echo "output=output-$TOOLCHAIN-$BUILDROOT-$inputs" >> "$GITHUB_OUTPUT"
        env:
          TOOLCHAIN: ${{ needs.toolchain.outputs.dir }}
          BUILDROOT: ${{ steps.buildroot.outputs.rev }}

      - uses: actions/cache/restore@v6
        id: output
        with:
          path: build/buildroot-onkyo_nr
          key: ${{ steps.key.outputs.output }}

      - name: Pull the build images
        run: |
          for i in buildroot:docker dspboot:dspboot/docker; do
            name=osiris-${i%%:*}
            tag=$(sha256sum "${i#*:}/Dockerfile" | cut -c1-12)
            img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$name:$tag
            if docker pull -q "$img"; then
              docker tag "$img" "$name:$tag"
            else
              echo "::notice::$img not published, make builds it"
            fi
          done

      - name: Build
        run: |
          mkdir -p build/ccache
          echo "max_size = 2G" > build/ccache/ccache.conf
          make buildroot

      - uses: actions/cache/save@v6
        if: ${{ success() && github.ref_type != 'tag' && steps.dl.outputs.cache-hit != 'true' }}
        with:
          path: dl
          key: dl-${{ steps.buildroot.outputs.rev }}-${{ hashFiles('external/configs/*', 'external/package/**') }}

      - uses: actions/cache/save@v6
        if: ${{ success() && github.event_name != 'pull_request' && github.ref_type != 'tag' && steps.output.outputs.cache-hit != 'true' }}
        with:
          path: build/buildroot-onkyo_nr
          key: ${{ steps.output.outputs.cache-primary-key }}

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.ref_type != 'tag' && steps.output.outputs.cache-hit != 'true' }}
        with:
          path: build/ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Disk usage
        if: ${{ !cancelled() }}
        run: df -h / && du -sh dl build/* 2> /dev/null || true

      - name: Bundle
        id: bundle
        run: |
          tar=$(basename dist/images/osiris-*.tar)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tar" != "$GITHUB_REF_NAME.tar" ]; then
            echo "::error::$tar does not match the tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "tar=$tar" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/images/${{ steps.bundle.outputs.tar }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: install
          path: |
            dist/images/kernel.itb
            dist/images/initrd-installer
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/osiris-v') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.tar }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: install
          path: dist

      - name: Create a draft release
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::a release for $tag exists already"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 --match 'osiris-v*' "$tag^" 2>/dev/null || true)
          {
            git tag -l --format='%(contents:body)' "$tag" | sed '/./,$!d'
            if [ -n "$prev" ]; then
              n=$(git rev-list --count --no-merges "$prev..$tag" -- . ':!dspboot' ':!docs/dspboot.md')
              echo "## Changelog"
              echo
              echo "<details><summary>$n commits since ${prev#osiris-}</summary>"
              echo
              git log --reverse --no-merges --format='- %s (%h)' --abbrev=7 "$prev..$tag" \
                -- . ':!dspboot' ':!docs/dspboot.md'
              echo
              echo "</details>"
            fi
          } > notes.md
          gh release create "$tag" dist/* \
            --draft --verify-tag --title "OSIRIS ${tag#osiris-}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
