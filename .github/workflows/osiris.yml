# SPDX-License-Identifier: BSD-2-Clause

name: osiris

on:
  push:
    branches:
      - '**'
    paths:
      - 'buildroot'
      - 'buildroot-patches/**'
      - 'docker/**'
      - 'dspboot/docker/**'
      - 'dspboot/tools/**'
      - 'external/**'
      - 'services/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/osiris.yml'
  pull_request:
    paths:
      - 'buildroot'
      - 'buildroot-patches/**'
      - 'docker/**'
      - 'dspboot/docker/**'
      - 'dspboot/tools/**'
      - 'external/**'
      - 'services/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/osiris.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osiris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the build image if missing
        run: |
          tag=$(sha256sum docker/Dockerfile | cut -c1-12)
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/osiris-buildroot:$tag
          if docker manifest inspect "$img" > /dev/null 2>&1; then
            echo "$img already published"
            exit 0
          fi
          docker build -t "$img" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            docker
          docker push "$img"

  toolchain:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    outputs:
      dir: ${{ steps.key.outputs.dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Toolchain key
        id: key
        run: |
          name=$(sed -n 's|^BR2_TOOLCHAIN_EXTERNAL_PATH=".*/build/toolchains/\(.*\)"$|\1|p' \
            external/configs/onkyo_nr_defconfig)
          key=$({ git -C buildroot rev-parse HEAD; grep -E '^(# )?BR2_' \
            "external/configs/toolchain_${name}_defconfig"; } | sha256sum | cut -c1-12)
          echo "dir=$name-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: cache
        with:
          path: build/toolchains/${{ steps.key.outputs.dir }}
          key: toolchain-${{ steps.key.outputs.dir }}

      - name: Pull the build image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tag=$(sha256sum docker/Dockerfile | cut -c1-12)
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/osiris-buildroot:$tag
          if docker pull -q "$img"; then
            docker tag "$img" "osiris-buildroot:$tag"
          else
            echo "::notice::$img not published, make builds it"
          fi

      - name: Build the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: make toolchain

  build:
    needs: toolchain
    if: ${{ !cancelled() && needs.toolchain.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out Buildroot
        id: buildroot
        run: |
          git submodule update --init --depth 1 buildroot
          echo "rev=$(git -C buildroot rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: build/toolchains/${{ needs.toolchain.outputs.dir }}
          key: toolchain-${{ needs.toolchain.outputs.dir }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v6
        id: dl
        with:
          path: dl
          key: dl-${{ steps.buildroot.outputs.rev }}-${{ hashFiles('external/configs/*', 'external/package/**') }}
          restore-keys: dl-

      - uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-

      - name: Pull the build images
        run: |
          for i in buildroot:docker dspboot:dspboot/docker; do
            name=osiris-${i%%:*}
            tag=$(sha256sum "${i#*:}/Dockerfile" | cut -c1-12)
            img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$name:$tag
            if docker pull -q "$img"; then
              docker tag "$img" "$name:$tag"
            else
              echo "::notice::$img not published, make builds it"
            fi
          done

      - name: Build
        run: |
          mkdir -p build/ccache
          echo "max_size = 2G" > build/ccache/ccache.conf
          make buildroot

      - uses: actions/cache/save@v6
        if: ${{ success() && steps.dl.outputs.cache-hit != 'true' }}
        with:
          path: dl
          key: dl-${{ steps.buildroot.outputs.rev }}-${{ hashFiles('external/configs/*', 'external/package/**') }}

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: build/ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Disk usage
        if: ${{ !cancelled() }}
        run: df -h / && du -sh dl build/* 2> /dev/null || true

      - name: Bundle
        id: bundle
        run: echo "tar=$(basename dist/images/osiris-*.tar)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/images/${{ steps.bundle.outputs.tar }}
          archive: false
          if-no-files-found: error
